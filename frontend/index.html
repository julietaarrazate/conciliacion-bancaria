<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Cuadra — Conciliación bancaria</title>
    <meta name="description" content="Cuadra: conciliación bancaria con IA, multi-cliente, auditoría e historial." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="application-name" content="Cuadra" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuadra" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Preconnect al API para reducir latencia del primer request -->
    <link rel="preconnect" href="https://conciliacion-api.onrender.com" />
    <link rel="dns-prefetch" href="https://conciliacion-api.onrender.com" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Watchdog: si el root no se hidrata en 8s, asumimos que la PWA tiene
      // un SW/cache roto. Desregistramos TODO y recargamos limpio.
      // Esto rescata a usuarios con PWA instalada de versiones viejas.
      window.__appBooted = false;
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
          if (window.__appBooted) return;
          const root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          try {
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
          } catch (e) { /* ignore */ }
          // recarga sin cache
          window.location.reload();
        }, 8000);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Registrar SW solo despues que la app cargo, para no bloquear el primer paint
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW register failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
