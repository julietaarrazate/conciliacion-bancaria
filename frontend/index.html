    <!-- Tema sincrónico: aplica 'dark' antes del primer paint para evitar flash -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('app-theme');
          var dark = s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Watchdog: si el root no se hidrata en 8s, asumimos que la PWA tiene
      // un SW/cache roto. Desregistramos TODO y recargamos limpio.
      // Esto rescata a usuarios con PWA instalada de versiones viejas.
      window.__appBooted = false;
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
          if (window.__appBooted) return;
          const root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          try {
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
          } catch (e) { /* ignore */ }
          // recarga sin cache
          window.location.reload();
        }, 8000);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Registrar SW solo despues que la app cargo, para no bloquear el primer paint
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW register failed:', err);
          });
        });
      }
    </script>
  </body>
