    <path d="M34 62L51 79L86 44" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Cuadra -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="92" fill="white" letter-spacing="-3">
