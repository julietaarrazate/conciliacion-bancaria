# Railway deploy config — https://docs.railway.app
# Para usar: railway.app > New Project > Deploy from GitHub > seleccionar repo
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "python seed.py 2>&1 || true; exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300
