version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: conciliacion_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conciliacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conciliacion123}
      POSTGRES_DB: ${POSTGRES_DB:-conciliacion_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conciliacion}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: conciliacion_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-conciliacion}:${POSTGRES_PASSWORD:-conciliacion123}@postgres/${POSTGRES_DB:-conciliacion_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-cambiar-en-produccion}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: conciliacion_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
