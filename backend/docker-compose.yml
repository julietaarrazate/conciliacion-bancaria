version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: conciliacion_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conciliacion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: conciliacion_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/conciliacion_db
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: conciliacion_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
