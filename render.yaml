# Render Blueprint - https://render.com/docs/blueprint-spec
# Conecta tu repo GitHub a Render y este archivo despliega backend + BD automatico

databases:
  - name: conciliacion-db
    databaseName: conciliacion
    user: conciliacion
    plan: free

services:
  - type: web
    name: conciliacion-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conciliacion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
