# Render Blueprint — usa Neon (PostgreSQL externo, gratis para siempre)
# No incluye Render DB (vence a 90 dias)

services:
  - type: web
    name: conciliacion-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # El usuario la pega manualmente en el dashboard (seguridad)
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
