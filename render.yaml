# Render Blueprint - https://render.com/docs/blueprint-spec

databases:
  - name: conciliacion-db
    databaseName: conciliacion
    user: conciliacion
    plan: free

services:
  - type: web
    name: conciliacion-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -c \"from app.database import engine, Base; Base.metadata.create_all(bind=engine); print('[init] tables OK')\" && python seed.py || true; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conciliacion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: PYTHON_VERSION
        value: 3.11.9
