databases:
  - name: conciliacion-db
    plan: free
    region: oregon
    postgresMajorVersion: "15"
    ipAllowList: []

services:
  - type: web
    name: conciliacion-api
    runtime: python
    plan: free
    region: oregon
    branch: claude/vibrant-hamilton-Lc8uZ
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conciliacion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "https://conciliacion-bancaria-julietaarrazates-projects.vercel.app,https://conciliacion-bancaria-git-clau-9c49a5-julietaarrazates-projects.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.9"
