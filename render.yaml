# Render Blueprint — https://render.com/docs/blueprint-spec
# Usa Docker runtime (mas confiable que Python native en Render)

databases:
  - name: conciliacion-db
    databaseName: conciliacion
    user: conciliacion
    plan: free

services:
  - type: web
    name: conciliacion-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conciliacion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
