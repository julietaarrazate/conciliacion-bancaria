name: CI

# Corre los tests del backend y el type-check + build del frontend en cada push
# a main y en cada pull request. Los tests usan SQLite en memoria, así que no
# necesitan servicios externos (no toca Neon/Render).
#
# Optimizado para gastar POCOS minutos de Actions (cuota 2000/mes en repos
# privados), sin sacar ninguna verificación:
#   1. concurrency + cancel-in-progress: cancela corridas de commits ya superados.
#   2. job "changes" (dorny/paths-filter, ~10s): detecta qué área cambió, y solo
#      corre backend y/o frontend si esa área tiene cambios (un PR solo-backend NO
#      corre el build de frontend, y viceversa; un PR solo-docs no corre ninguno).
on:
  push:
    branches: [main]
  pull_request:

# Cancela la corrida anterior del mismo PR/rama cuando llega un push nuevo: no
# gastar minutos terminando tests de un commit que ya quedó viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar áreas cambiadas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend · ruff + pytest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        # requirements-dev.txt trae pytest/pytest-asyncio/httpx — sin él, el
        # paso "Tests" muere con "No module named pytest".
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint (ruff — reglas de bugs reales, ver ruff.toml)
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend · type-check + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (eslint — errores; las warnings no bloquean)
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          # El build no debe depender de secretos; las features opt-in se degradan
          # solas si la env var no está (ver docs/architecture/ARCHITECTURE.md).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
