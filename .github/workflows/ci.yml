name: CI

# Corre los tests del backend y el type-check + build del frontend en cada push
# a main y en cada pull request. Los tests usan SQLite en memoria, así que no
# necesitan servicios externos (no toca Neon/Render).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          # El build no debe depender de secretos; las features opt-in se degradan
          # solas si la env var no está (ver docs/architecture/ARCHITECTURE.md).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
