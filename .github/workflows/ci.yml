name: CI

# Corre los tests del backend y el type-check + build del frontend en cada push
# a main y en cada pull request. Los tests usan SQLite en memoria, así que no
# necesitan servicios externos (no toca Neon/Render).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        # requirements-dev.txt trae pytest/pytest-asyncio/httpx — sin él, el
        # paso "Tests" muere con "No module named pytest".
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint (ruff — reglas de bugs reales, ver ruff.toml)
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (eslint — errores; las warnings no bloquean)
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          # El build no debe depender de secretos; las features opt-in se degradan
          # solas si la env var no está (ver docs/architecture/ARCHITECTURE.md).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
