# Actualizaciones de dependencias automáticas (semanal) para no acumular deuda
# de versiones. Genera PRs que el CI valida antes de mergear.
# Menores y parches van agrupados en un solo PR por ecosistema; los saltos de
# versión mayor quedan fuera del grupo y llegan de a uno (cada uno puede exigir
# migración: ver #187, que juntó 8 mayores y no instalaba).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
